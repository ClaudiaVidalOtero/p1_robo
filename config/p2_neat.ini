# Práctica 2 — Configuración de NEAT-Python 2.0.
# Punto de partida: las indicaciones técnicas (apartado 3). Cambios:
#   num_inputs = 3   observación de la P1 [posx, size, posy] (OBS_Y=true, OBS_IR=false)
#   compatibility_threshold = 1.7   (ver [DefaultSpeciesSet])
#   seed             la sobrescribe p2_neat.py con --semilla al crear cada evolución;
#                    la copia de este archivo dentro de p2_evol/<nombre>/ lleva la usada.
# NEAT-Python no admite parámetros que falten ni desconocidos.

[NEAT]
fitness_criterion      = max
fitness_threshold      = 1000.0
no_fitness_termination = True
pop_size               = 20
reset_on_extinction    = True
seed                   = 0

[DefaultGenome]
num_inputs         = 3
num_hidden         = 0
num_outputs        = 2
feed_forward       = True
initial_connection = full_direct

# tanh de NEAT-Python = tanh(2,5·z): salida en [-1, 1], igual que el espacio de acción.
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

bias_init_mean    = 0.0
bias_init_stdev   = 1.0
bias_max_value    = 5.0
bias_min_value    = -5.0
bias_mutate_power = 0.5
bias_mutate_rate  = 0.7
bias_replace_rate = 0.1

response_init_mean    = 1.0
response_init_stdev   = 0.0
response_max_value    = 5.0
response_min_value    = -5.0
response_mutate_power = 0.0
response_mutate_rate  = 0.0
response_replace_rate = 0.0

weight_init_mean    = 0.0
weight_init_stdev   = 1.0
weight_max_value    = 5.0
weight_min_value    = -5.0
weight_mutate_power = 0.5
weight_mutate_rate  = 0.8
weight_replace_rate = 0.1

enabled_default     = True
enabled_mutate_rate = 0.01

conn_add_prob    = 0.3
conn_delete_prob = 0.1
node_add_prob    = 0.1
node_delete_prob = 0.05

compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

[DefaultSpeciesSet]
# 3,0 (indicaciones) deja una sola especie: la distancia genética media de la
# población inicial es ~1,0. Barrido sin simulador (5 semillas x 30
# generaciones, calidad ficticia): 1,8 -> 2-3 especies; 1,7 -> 2-6 (media 4,2);
# 1,6 -> hasta 7; <= 1,2 -> más de 10 y NEAT-Python 2.0 aborta, porque
# pop_size (20) < especies x min_species_size (2).
compatibility_threshold = 1.7

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 8
species_elitism      = 1

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.3
min_species_size   = 2
